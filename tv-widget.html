<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Gráfico</title>
<style>html,body{margin:0;height:100%;background:#131722}</style>
</head>
<body>
<div id="tv" style="height:100vh"></div>
<script src="https://s3.tradingview.com/tv.js"></script>
<script>
  // Se sirve como archivo real (no data: URL) a propósito: así el navegador tiene un
  // origen estable y TradingView puede guardar en localStorage lo que cambies a mano
  // en el gráfico entre visitas (vía auto_save_delay).
  var p = new URLSearchParams(location.search);
  var symbol = p.get('symbol') || 'AAPL';
  var theme = p.get('theme') === 'light' ? 'light' : 'dark';
  var tvWidget = new TradingView.widget({
    autosize: true,
    symbol: symbol,
    interval: 'D',
    timezone: 'exchange',
    theme: theme,
    style: '1',
    locale: 'es',
    allow_symbol_change: false,
    withdateranges: true,
    hide_side_toolbar: false,
    studies: [
      {id: 'MASimple@tv-basicstudies', inputs: {length: 50}},
      {id: 'MAExp@tv-basicstudies', inputs: {length: 200}},
      {id: 'RSI@tv-basicstudies', inputs: {length: 14}},
      {id: 'PivotPointsHighLow@tv-basicstudies', inputs: {}},
      {id: 'LinearRegression@tv-basicstudies', inputs: {}}
    ],
    auto_save_delay: 5,
    container_id: 'tv'
  });
  // "studies_overrides" en el constructor es un bug conocido del widget gratuito de
  // TradingView: no lo aplica. El color por default hay que setearlo con la API del
  // widget una vez que el gráfico terminó de cargar.
  tvWidget.onChartReady(function () {
    try {
      tvWidget.applyStudiesOverrides({
        'moving average exponential.plot.color': '#FFFFFF'
      });
    } catch (e) {}
  });
</script>
</body>
</html>
