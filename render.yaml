services:
  - type: web
    name: finterm-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/docs
    envVars:
      - key: PORT
        value: 8000
      - key: FINNHUB_KEY
        sync: false
      - key: ALPHAVANTAGE_KEY
        sync: false
      - key: SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5
      - key: AI_ACCESS_CODE
        sync: false
      - key: AI_RATE_LIMIT_PER_HOUR
        value: 30
      - key: DB_PATH
        value: finterm.db
